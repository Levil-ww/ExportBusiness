<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>生意参谋数据下载</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; background: #f4f6fb; color: #17233b; font: 14px/1.5 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    main { padding: 20px; }
    .eyebrow { margin: 0 0 5px; color: #5272d8; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    h1 { margin: 0; font-size: 19px; line-height: 1.4; }
    .intro { margin: 6px 0 17px; color: #7b879a; font-size: 12px; }
    .card { padding: 15px; border: 1px solid #e6ebf3; border-radius: 12px; background: #fff; box-shadow: 0 5px 18px rgba(32,49,83,.04); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #aabdfb; outline-offset: 2px; }
    .primary { width: 100%; padding: 10px 14px; border: 0; border-radius: 8px; background: #315efb; color: #fff; font-weight: 650; }
    .primary:hover { background: #244edc; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .secondary { min-height: 36px; padding: 7px 8px; border: 1px solid #e1e7f3; border-radius: 8px; background: #f7f9fd; color: #536582; font-size: 12px; font-weight: 600; }
    .secondary:hover { background: #edf2fc; border-color: #ccd9f1; }
    .stop { color: #a45d5d; background: #fffafa; border-color: #f0dddd; }
    .stop:hover { background: #fff0f0; border-color: #eacaca; }
    .section-label { margin: 15px 0 7px; color: #9aa5b6; font-size: 11px; font-weight: 650; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .schedule { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #eaf0ff; color: #647693; font-size: 12px; }
    .schedule strong { display: block; margin-bottom: 4px; color: #405b93; font-size: 12px; }
    .schedule p { margin: 0; }
    #message { margin: 12px 2px 0; color: #65758e; font-size: 12px; overflow-wrap: anywhere; }
    #message:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">SYCM DATA EXPORT</p>
    <h1>生意参谋数据下载</h1>
    <p class="intro">设置归档目录后，即可启动下载流程。</p>
    <section class="card" aria-label="下载操作">
      <button class="primary" id="start">开始下载</button>
      <div class="actions">
        <button class="secondary" id="open-settings">目录与状态</button>
        <button class="secondary stop" id="stop">停止当前流程</button>
      </div>
      <p class="section-label">单项验证</p>
      <div class="checks">
        <button class="secondary" id="check-search">验证搜索词下载</button>
        <button class="secondary" id="check-content">验证内容下载</button>
      </div>
    </section>
    <section class="schedule" aria-label="下载安排">
      <strong>下载安排</strong>
      <p>周二至周四逐日检查本周一到昨天的商品和店铺来源；周五至周日及周一检查最近一个周四到昨天的数据，已存在的文件会跳过。周一、周四下载截至昨天的 7 天搜索词；周一下载上周四至周日的内容，周四下载本周一至周三的内容。需手动启动，尚无定时任务。</p>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
